name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: docker build -t blackwell-index:verify .
      - run: sh scripts/docker-smoke.sh blackwell-index:verify
  pyth-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: |
            ~/.cargo/bin/pyth-lazer-agent
            ~/.cargo/registry
          key: pyth-agent-0.16.0-linux-${{ runner.arch }}
      - run: bun install --frozen-lockfile
      - run: command -v pyth-lazer-agent || cargo install pyth-lazer-agent --version 0.16.0 --locked
      - run: PYTH_AGENT_BIN="$(command -v pyth-lazer-agent)" bun test test/pyth.test.ts
