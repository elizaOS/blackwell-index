<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Blackwell Index: provider reference prices for NVIDIA B200, B300, GB200 and GB300 compute, with an open methodology and node software.">
  <meta name="color-scheme" content="light">
  <title>Blackwell Index — SBX</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <script type="module" src="/assets/index.js"></script>
</head>
<body class="index-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Blackwell Index home"><span>Blackwell Index</span></a>
      <nav aria-label="Main navigation"><a href="/" aria-current="page">Index</a><a href="/providers.html">Providers</a><a href="/methodology.html">Methodology</a><a href="/v1/demo">API</a><a href="https://github.com/elizaOS/blackwell-index">Source code</a><a href="https://github.com/elizaOS/blackwell-index#run-a-node">Run a node ↗</a></nav>
    </header>

    <main id="main">
      <h1 class="visually-hidden">Blackwell Index prices</h1>
      <p class="visually-hidden" id="connection-status" role="status" aria-live="polite">Loading current prices…</p>

      <section class="composite-card" aria-label="Composite price in USD per GPU-hour">
        <div class="composite-main">
          <p class="composite-price" id="composite-price">—</p>
          <p id="publication-scope-label" hidden></p>
          <p class="visually-hidden">USD per physical GPU-hour</p>
        </div>
      </section>

      <section class="model-grid" aria-label="GPU model prices">
        <article class="model-card" data-model="B200"><div class="card-heading"><h2>B200</h2></div><p class="model-price">—</p></article>
        <article class="model-card" data-model="B300"><div class="card-heading"><h2>B300</h2></div><p class="model-price">—</p></article>
        <article class="model-card" data-model="GB200"><div class="card-heading"><h2>GB200</h2></div><p class="model-price">—</p></article>
        <article class="model-card" data-model="GB300"><div class="card-heading"><h2>GB300</h2></div><p class="model-price">—</p></article>
      </section>

      <noscript><p class="notice">JavaScript is needed to display feed updates. The <a href="/v1/demo">API response</a> is available directly.</p></noscript>
    </main>
  </div>
</body>
</html>
